spring.application.name=SwapTN
server.port=${SERVER_PORT:8081}

# Local MySQL / XAMPP. Override these values through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swaptn?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
jwt.secret=${JWT_SECRET:local-development-signing-key-change-before-deployment-1234567890}
jwt.expiration=86400000
